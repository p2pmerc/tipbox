[package]
name = "tipbox"
version = "0.1.0"
edition = "2021"
description = "A NEAR contract where fans deposit NEAR and creators withdraw what they are owed."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
